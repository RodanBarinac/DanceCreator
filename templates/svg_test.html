<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inline SVG Test</title>
</head>
<body>
    <h1>Direct SVG Test (No Module Import)</h1>
    
    <!-- Test 1: Direct SVG with circle -->
    <h2>Test 1: Direct SVG Circle</h2>
    <svg width="200" height="200" viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="30" fill="#0072B2" stroke="#111827" stroke-width="2"/>
    </svg>

    <!-- Test 2: Direct SVG with rect -->
    <h2>Test 2: Direct SVG Square</h2>
    <svg width="200" height="200" viewBox="0 0 200 200">
        <rect x="85" y="85" width="30" height="30" rx="4" fill="#E69F00" stroke="#111827" stroke-width="2"/>
    </svg>

    <!-- Test 3: SVG created via JavaScript -->
    <h2>Test 3: JavaScript-Created SVG</h2>
    <div id="js-test"></div>

    <script>
        // Create SVG using JavaScript (like the render function does)
        const svgNS = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(svgNS, 'svg');
        svg.setAttribute('width', '200');
        svg.setAttribute('height', '200');
        svg.setAttribute('viewBox', '0 0 200 200');
        
        // Add a circle
        const circle = document.createElementNS(svgNS, 'circle');
        circle.setAttribute('cx', '100');
        circle.setAttribute('cy', '100');
        circle.setAttribute('r', '30');
        circle.setAttribute('fill', '#0072B2');
        circle.setAttribute('stroke', '#111827');
        circle.setAttribute('stroke-width', '2');
        svg.appendChild(circle);
        
        document.getElementById('js-test').appendChild(svg);
        console.log('SVG created and appended');
    </script>
</body>
</html>
