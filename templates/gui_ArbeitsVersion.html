
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>GUI mit Resizable Bereichen</title>
    <!-- Einbinden von CSS aus dem static-Ordner -->
    <link rel="stylesheet" href="../static/Dance_Creator.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jstree@3.3.12/dist/themes/default/style.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jstree@3.3.12/dist/jstree.min.js"></script>

</head>
<body>
  <div id="header">
    <div id="header-left">
        <div id="file-path">Pfad: /path/to/current/file.dc</div>
    </div>
    <div id="header-center">
        <h2>Dance Creator</h2>
    </div>
    <div id="header-right">
        <button id="btn-load">Load</button>
        <button id="btn-save">Save</button>
    </div>
  </div>
<!-- Grundsätzlicher Aufbau -->
  <div id="container">
    <div id="left" class="panel">
      <h3>Figuren</h3>
      <!-- Suchfeld -->
      <input type="text" id="search" placeholder="Suche nach Name..." style="width: 100%; margin-bottom: 10px;">

      <label for="filter">Filter:</label>
      <select id="filter">
          <option value="">Alle Typen</option>
          <option value="simple">Simple</option>
          <option value="complex">Complex</option>
      </select>
        <div id="figure-list"></div>
    </div>

    <div class="splitter" id="splitter-left"></div>
    <div id="middle" class="panel">
      <h3>Arbeitsbereich</h3>
    </div>
    <div class="splitter" id="splitter-right"></div>
    <div id="right" class="panel">
      <h3>Dancestruktur</h3>
      <div id="floor-preview" style="height:320px; margin-bottom:10px; border:1px solid #e5e7eb; border-radius:8px; background:#fff; display:flex; align-items:center; justify-content:center; overflow:hidden;"></div>
      <p><em><div id="treeview"></div></em></p>
    </div>
  </div>

  <script>
          <!-- *************************** -->
          <!-- *** Splitter funktionen *** -->
          <!-- *************************** -->

    function makeSplitter(splitterId, leftPanelId, rightPanelId) {
      const splitter = document.getElementById(splitterId);
      const leftPanel = document.getElementById(leftPanelId);
      const rightPanel = document.getElementById(rightPanelId);

      splitter.addEventListener('mousedown', function(e) {
        e.preventDefault();
        document.addEventListener('mousemove', resize);
        document.addEventListener('mouseup', stopResize);
      });

      function resize(e) {
        const totalWidth = splitter.parentNode.offsetWidth;
        const leftWidth = e.clientX;
        const rightWidth = totalWidth - leftWidth - 10; // 10 = 2 splitters width

        if (leftWidth > 100 && rightWidth > 100) {
          leftPanel.style.width = leftWidth + 'px';
          rightPanel.style.width = rightWidth + 'px';
        }
      }

      function stopResize() {
        document.removeEventListener('mousemove', resize);
        document.removeEventListener('mouseup', stopResize);
      }
    }

    makeSplitter('splitter-left', 'left', 'middle');
    makeSplitter('splitter-right', 'middle', 'right');
  </script>



  <script>
// Verstecktes File-Input erzeugen

          <!-- ******************** -->
          <!-- *** Laden Button *** -->
          <!-- ******************** -->

const fileInput = document.createElement('input');
fileInput.type = 'file';
fileInput.accept = '.json';
fileInput.style.display = 'none';
fileInput.webkitdirectory = false;
document.body.appendChild(fileInput);

// Load-Button klick → Datei-Auswahl
document.getElementById('btn-load').addEventListener('click', () => {
    fileInput.click();
});

// Wenn Datei gewählt → an /tree senden
fileInput.addEventListener('change', () => {
    if (!fileInput.files.length) return;

    const file = fileInput.files[0];
    const fileName = file.name;

    // jsTree mit neuer Datei laden
    reloadTreeFromFile(fileName);
});

// Funktion zum Neuladen des Trees
function reloadTreeFromFile(fileName) {
    $('#treeview').jstree(true).settings.core.data = {
        url: `/tree?file=${fileName}`,
        dataType: 'json'
    };
    $('#treeview').jstree(true).refresh();
}
</script>


<script>
          <!-- *********************** -->
          <!-- *** Tree funktionen *** -->
          <!-- *********************** -->

$(function() {
  $('#treeview').jstree({
    'core': {
      'data': [
        { "text": "Dance", "id": "dance-node" }
      ]
    }
  });

  // When a node (dance) is selected, fetch its dance JSON and render starting floor
  $('#treeview').on('select_node.jstree', async function (e, data) {
    try {
      const node = data.node;
      const identifier = node && (node.text || node.id);
      if (!identifier) return;
      // fetch dance detail
      const resp = await fetch('/api/dances/' + encodeURIComponent(identifier));
      if (!resp.ok) {
        console.warn('Dance detail not found for', identifier);
        return;
      }
      const payload = await resp.json();
      const dance = payload && payload.dance ? payload.dance : payload;
      // determine couple count heuristically
      let couples = dance && (dance.couples || dance.Couples || dance.CoupleCount || dance.shape || dance.Shape) || null;
      if (typeof couples === 'object' && couples != null) {
        // maybe shape contains couples
        couples = (dance.shape && dance.shape.couples) || (dance.Shape && dance.Shape.couples) || null;
      }
      couples = Number(couples) || 4;

      // init floor and render
      const initResp = await fetch('/api/dancefloor/init', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ couples: couples, name: identifier })
      });
      const floorJson = await initResp.json();
      if (window.renderDanceFloorJSON) window.renderDanceFloorJSON(floorJson);
    } catch (err) {
      console.error('Error rendering starting dancefloor:', err);
    }
  });
});
</script>

<script>
function loadFigures() {
          <!-- *********************** -->
          <!-- ***  Cards füllen   *** -->
          <!-- *********************** -->

    fetch('/figures')
        .then(response => response.json())
        .then(data => {
            const container = document.getElementById('figure-list');
            container.innerHTML = '';

            data.forEach(fig => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.type = fig.type;

                card.innerHTML = `
                    <strong>${fig.name}</strong><br>
                    Typ: ${fig.type}<br>
                    <em>${fig.desc || ''}</em>
                `;

                container.appendChild(card);
            });
        })
        .catch(err => console.error('Fehler beim Laden der Figuren:', err));
}

// Filter anwenden
document.getElementById('search').addEventListener('input', function() {
    const text = this.value.toLowerCase();
    const cards = document.querySelectorAll('#figure-list .card');

    cards.forEach(card => {
        const name = card.querySelector('strong').textContent.toLowerCase();
        if (name.includes(text)) {
            card.style.display = 'block';
        } else {
            card.style.display = 'none';
        }
    });
});
function applyFilters() {
    const type = document.getElementById('filter').value;
    const text = document.getElementById('search').value.toLowerCase();
    const cards = document.querySelectorAll('#figure-list .card');

    cards.forEach(card => {
        const matchesType = !type || card.dataset.type === type;
        const matchesText = card.querySelector('strong').textContent.toLowerCase().includes(text);

        card.style.display = (matchesType && matchesText) ? 'block' : 'none';
    });
}

document.getElementById('filter').addEventListener('change', applyFilters);
document.getElementById('search').addEventListener('input', applyFilters);

// Figuren direkt beim Start laden
document.addEventListener('DOMContentLoaded', loadFigures);
</script>

<script type="module">
import { renderDanceFloor } from '/static/Dancefloor_Render.js';

const preview = document.getElementById('floor-preview');

function getPreviewSize() {
  return { width: preview.clientWidth || 600, height: preview.clientHeight || 320 };
}

async function renderFromJSON(json) {
  if (!preview) return;
  preview.innerHTML = '';
  const { width, height } = getPreviewSize();
  const svg = renderDanceFloor(json, { width, height, paddingPx: 18, tokenLogicalRadius: 0.5 });
  preview.appendChild(svg);
}

window.renderDanceFloorJSON = renderFromJSON;

window.renderDanceFloorExecute = async function(figure, couples=4, anchor=[0,0], addons=[], dance_name='preview') {
  try {
    const resp = await fetch('/api/dancefloor/execute', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ figure, couples, anchor, addons, dance_name })
    });
    const data = await resp.json();
    if (data && data.status === 'ok' && data.floor) {
      renderFromJSON(data.floor);
    } else if (data && data.name && data.positions) {
      renderFromJSON(data);
    } else {
      console.warn('Unexpected dancefloor execute response', data);
    }
  } catch(e){ console.error(e); }
}

// initial hardcoded starting floor for 4 couples (original places)
const initialFloor = {
  name: 'Preview',
  couples: 4,
  tick: 0,
  positions: {
    '1m': { dancer: { name: '1M', gender: 'M' }, coord: [1,1], facing: 0 },
    '1w': { dancer: { name: '1W', gender: 'F' }, coord: [1,3], facing: 0 },
    '2m': { dancer: { name: '2M', gender: 'M' }, coord: [2,1], facing: 0 },
    '2w': { dancer: { name: '2W', gender: 'F' }, coord: [2,3], facing: 0 },
    '3m': { dancer: { name: '3M', gender: 'M' }, coord: [3,1], facing: 0 },
    '3w': { dancer: { name: '3W', gender: 'F' }, coord: [3,3], facing: 0 },
    '4m': { dancer: { name: '4M', gender: 'M' }, coord: [4,1], facing: 0 },
    '4w': { dancer: { name: '4W', gender: 'F' }, coord: [4,3], facing: 0 }
  }
};

// render initial preview immediately
window.addEventListener('load', ()=>{
  try { renderFromJSON(initialFloor); } catch(e){ console.error(e); }
});
</script>
</body>
</html>
