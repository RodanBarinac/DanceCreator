
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>GUI mit Resizable Bereichen</title>
  <style>
    body, html {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
    }
    #container {
      display: flex;
      height: 100%;
      width: 100%;
    }
    .panel {
      padding: 10px;
      overflow: auto;
    }
    #left {
      width: 25%;
      background-color: #f0f0f0;
    }
    #middle {
      width: 50%;
      background-color: #ffffff;
      border-left: 1px solid #ccc;
      border-right: 1px solid #ccc;
    }
    #right {
      width: 25%;
      background-color: #f9f9f9;
    }
    .splitter {
      width: 5px;
      background-color: #ccc;
      cursor: col-resize;
    }
    .card {
      border: 1px solid #aaa;
      border-radius: 5px;
      padding: 10px;
      margin-bottom: 10px;
      background-color: #fff;
      box-shadow: 1px 1px 5px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="left" class="panel">
      <h3>Datensätze</h3>
      <label for="filter">Filter:</label>
      <select id="filter">
        <option value="">Alle Typen</option>
        <option value="bewegung">Bewegungspfad</option>
        <option value="orientierung">Orientierungspfad</option>
      </select>
      <div class="card">Datensatz A<br>Typ: Bewegungspfad</div>
      <div class="card">Datensatz B<br>Typ: Orientierungspfad</div>
      <div class="card">Datensatz C<br>Typ: Zeitmarkierung</div>
    </div>
    <div class="splitter" id="splitter-left"></div>
    <div id="middle" class="panel">
      <h3>Arbeitsbereich</h3>
    </div>
    <div class="splitter" id="splitter-right"></div>
    <div id="right" class="panel">
        <h3>Dance Tree</h3>
        <!-- jsTree Container -->
        <div id="treeContainer" class="tree"></div>
    </div>

  </div>

  <script src="../static/resize.js"></script>

  <!-- App-Logic: lädt /tree?file=... und füllt die Bereiche -->
  <!-- jQuery (Pflicht für jsTree) -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- jsTree JS -->
  <script src="https://cdn.jsdelivr.net/npm/jstree@3.3.15/dist/jstree.min.js"></script>
  <script src="../static/Tree.js"></script>

    <script>
        renderJsTree([]);
    </script>
</body>
</html>
