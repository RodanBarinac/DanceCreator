[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "DanceCreator"
version = "0.1.0"
description = "Scottish Country Dancing choreography creator and visualizer"
readme = "Readme.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "DanceCreator Contributors"}
]

dependencies = [
    "Flask",
    "jsonschema",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.setuptools]
packages = [""]
